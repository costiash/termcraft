name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cases:
        description: "which eval cases to run live"
        type: choice
        default: smoke
        options: [smoke, create, audit, all]
      max_cost_usd:
        description: "hard cost ceiling for the run"
        default: "15"
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: pip install pyyaml pillow numpy
      # ubuntu-latest ships an older Claude Code; put the freshly installed one first on PATH
      - run: |
          npm install -g @anthropic-ai/claude-code@latest
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      - name: toolchain
        run: |
          python3 --version
          which -a claude; claude --version
          claude plugin validate --strict .claude-plugin/plugin.json
      - name: all gates
        run: python3 scripts/check_plugin.py
      - name: report (json)
        if: always()
        run: python3 scripts/check_plugin.py --json > check-report.json || true
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: check-report, path: check-report.json }
  # Live acceptance: runs the smoke eval against a real model. Needs ANTHROPIC_API_KEY in repo secrets;
  # opt-in via workflow_dispatch so pushes stay free.
  live-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: |
          npm install -g @anthropic-ai/claude-code@latest
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      # the CLI refuses a Bash grant without a sandbox backend; Ubuntu 24.04 also blocks unprivileged user
      # namespaces (AppArmor) which bubblewrap needs, so lift that for the job and prove bwrap works first
      - run: |
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true && echo "bwrap ok"
      - name: live eval (${{ inputs.cases || 'smoke' }})
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          case "${{ inputs.cases || 'smoke' }}" in
            smoke)  TAGS="--tag smoke";            TOOLS="Bash";            SCAFFOLD="" ;;
            create) TAGS="--tag create";           TOOLS="Bash Write Edit"; SCAFFOLD="--scaffold" ;;
            audit)  TAGS="--tag audit";            TOOLS="Bash Write Edit"; SCAFFOLD="--scaffold" ;;
            all)    TAGS="";                       TOOLS="Bash Write Edit"; SCAFFOLD="--scaffold" ;;
          esac
          claude plugin eval . --trust-plugin $TAGS $SCAFFOLD --allow-tools $TOOLS --runs 1 --ablation none \
            --no-publish --keep-temp --max-cost-usd "${{ inputs.max_cost_usd || '15' }}" --json eval-result.json \
            || echo "eval exit $?"   # a failing case still produces the JSON; the summary step reports it
      - name: eval summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          if not os.path.exists("eval-result.json"): raise SystemExit("no eval-result.json")
          d = json.load(open("eval-result.json"))
          print(f"claude {d.get('claudeVersion')}  cost ${d.get('costUsd', 0):.2f}  {d.get('durationSeconds')}s  partial={d.get('partial')} {d.get('partialReason', '')}")
          bad = 0
          for c in d["cases"]:
              for arm, runs in c["arms"].items():
                  for r in runs:
                      bad += not r["passed"]
                      print(f"{c['name']} [{arm}] score={r['score']} turns={r['turns']} error={r.get('error')}")
                      for g in r["graders"]:
                          print(f"   {'PASS' if g['passed'] else 'FAIL'} {g['name']}: {str(g.get('explanation', ''))[:300]}")
          raise SystemExit(1 if bad else 0)
          PY
      - name: collect sandboxes (what the agent actually wrote)
        if: always()
        run: |
          mkdir -p sandboxes
          # --keep-temp seals home/ and tmp/ (mode 000); open them read-only for the archive, never run git inside
          for d in /tmp/claude-eval-*; do
            [ -d "$d" ] || continue
            sudo chmod -R a+rX "$d" || true
            tar --exclude='*/node_modules' --exclude='*/.venv' --exclude='*/__pycache__' --exclude='*/.git' -czf "sandboxes/$(basename "$d").tgz" -C "$d" . || true
          done
          ls -la sandboxes
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-${{ inputs.cases || 'smoke' }}
          path: |
            eval-result.json
            evals/results
            sandboxes
