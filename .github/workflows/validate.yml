name: validate
on: [push, pull_request, workflow_dispatch]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pyyaml pillow numpy
      - run: npm install -g @anthropic-ai/claude-code
      - name: all gates (official validate, manifest, links, compile, tests, previews, contrast, evals, package)
        run: python3 scripts/check_plugin.py --json | tee check-report.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(('PASS' if g['ok'] else 'FAIL'), g['gate'], *g['notes'], sep='\n  ') for g in d['gates']]; sys.exit(0 if d['ok'] else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: check-report, path: check-report.json }
  # Live acceptance: runs the smoke eval against a real model. Needs ANTHROPIC_API_KEY (or OAuth) in secrets;
  # opt-in via workflow_dispatch so pushes stay free.
  live-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g @anthropic-ai/claude-code
      - env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: claude plugin eval . --trust-plugin --tag smoke --runs 1 --ablation none --allow-tools Bash --no-publish --max-cost-usd 5 --json eval-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke
          path: |
            eval-smoke.json
            evals/results
